<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool List Viewer</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      background: #fafafa;
    }

    .toolbar {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    details.menu {
      display: inline-block;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
    }

    details.menu summary {
      cursor: pointer;
      user-select: none;
      font-weight: 600;
    }

    .menu-content {
      margin-top: 0.65rem;
      display: grid;
      gap: 0.4rem;
      min-width: 260px;
    }

    .field-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 5px;
      padding: 0.5rem;
      background: #fafafa;
    }

    .field-list label {
      display: block;
      margin-bottom: 0.35rem;
    }

    .menu-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .secondary-btn {
      border: 1px solid #d0d0d0;
      background: #fff;
      border-radius: 5px;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
    }

    .secondary-btn:hover {
      background: #f4f4f4;
    }

    table.dataTable {
      width: 100% !important;
    }

    .dataTables_wrapper {
      width: 100%;
    }

    .dataTables_wrapper .dataTables_scroll {
      overflow-x: auto;
    }

    #bibTable th,
    #bibTable td {
      max-width: 25vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #bibTable th.goto-column,
    #bibTable td.goto-column {
      min-width: 3rem;
      max-width: 3rem;
      width: 3rem;
    }

    .goto-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }

    .goto-btn:hover {
      background-color: #45a049;
    }

    .goto-btn:disabled {
      background-color: #b5b5b5;
      cursor: not-allowed;
    }

    .table-container {
      max-height: 75vh;
      overflow: auto;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <details class="menu">
      <summary>Columns</summary>
      <div class="menu-content">
        <div id="fieldMenu" class="field-list"></div>
        <div class="menu-buttons">
          <button id="resetColumnsBtn" class="secondary-btn" type="button">Reset to defaults</button>
        </div>
      </div>
    </details>
    <button id="downloadFullToolsBtn" class="secondary-btn" type="button">Download full Tools.txt</button>
  </div>

  <div class="table-container">
    <table id="bibTable" class="display nowrap" style="width:100%">
      <thead>
        <tr id="tableHeadRow"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    const TOOL_CATEGORIES = [
      "Guides",
      "Datasets",
      "Libraries",
      "Products",
      "Scripts",
      "Specifications",
      "Software",
      "Others"
    ];

    const FALLBACK_CONFIG = {
      availableFields: ["title", "description", "author", "tags", "category", "link"],
      defaultFields: ["title", "description", "author", "tags", "category"]
    };

    let toolEntries = [];
    let toolListText = "";
    let viewerConfig = { ...FALLBACK_CONFIG };
    let visibleFields = [...FALLBACK_CONFIG.defaultFields];
    let dataTableInstance = null;

    async function loadConfig() {
      try {
        const res = await fetch("viewer.config.json?t=" + Date.now());
        if (!res.ok) throw new Error(res.statusText);

        const config = await res.json();
        const available = uniqueLowercaseArray(config.availableFields);
        let defaults = uniqueLowercaseArray(config.defaultFields);

        const safeAvailable = available.length ? available : [...FALLBACK_CONFIG.availableFields];
        defaults = defaults.filter(f => safeAvailable.includes(f));
        if (!defaults.length) defaults = [...FALLBACK_CONFIG.defaultFields];

        return {
          availableFields: mergeUnique(safeAvailable, defaults),
          defaultFields: defaults
        };
      } catch (err) {
        console.warn("Failed to load viewer.config.json, using fallback config.", err);
        return { ...FALLBACK_CONFIG };
      }
    }

    async function loadTools() {
      try {
        viewerConfig = await loadConfig();

        const res = await fetch("Tools.txt?t=" + Date.now());
        if (!res.ok) throw new Error(res.statusText);
        toolListText = await res.text();

        const parsed = parseToolList(toolListText);
        toolEntries = parsed.entries;

        if (!toolEntries.length) {
          document.body.innerHTML += "<p>No entries found in Tools.txt</p>";
          return;
        }

        hydrateAvailableFields(parsed.headers);
        visibleFields = [...viewerConfig.defaultFields];

        renderFieldMenu();
        renderTable();
        bindGlobalHandlers();
      } catch (err) {
        document.body.innerHTML += "<p>Error loading tool list: " + escapeHtml(String(err)) + "</p>";
      }
    }

    function renderTable() {
      const headRow = document.getElementById("tableHeadRow");
      const body = document.getElementById("tableBody");

      if ($.fn.DataTable.isDataTable("#bibTable") && dataTableInstance) {
        dataTableInstance.destroy();
      }

      headRow.innerHTML = [
        '<th class="goto-column">Goto</th>',
        ...visibleFields.map(f => "<th>" + formatFieldLabel(f) + "</th>")
      ].join("");

      body.innerHTML = toolEntries.map((entry, idx) => {
        const linkUrl = getGotoUrl(entry);
        const gotoButton = linkUrl
          ? '<button class="goto-btn" data-idx="' + idx + '" title="Open tool link">Goto</button>'
          : '<button class="goto-btn" disabled title="No link found">Goto</button>';

        return (
          "<tr>" +
            '<td class="goto-column">' + gotoButton + "</td>" +
            visibleFields.map(f => "<td>" + escapeHtml(getFieldDisplayValue(entry, f)) + "</td>").join("") +
          "</tr>"
        );
      }).join("");

      dataTableInstance = $("#bibTable").DataTable({
        paging: false,
        info: false,
        scrollY: "70vh",
        scrollX: true,
        scrollCollapse: true,
        searching: true,
        autoWidth: false,
        destroy: true
      });

      bindGotoHandlers();
    }

    function renderFieldMenu() {
      const fieldMenu = document.getElementById("fieldMenu");
      const resetBtn = document.getElementById("resetColumnsBtn");

      fieldMenu.innerHTML = viewerConfig.availableFields.map(field => {
        const checked = visibleFields.includes(field) ? "checked" : "";
        return '<label><input type="checkbox" value="' + field + '" ' + checked + "> " + formatFieldLabel(field) + "</label>";
      }).join("");

      fieldMenu.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.addEventListener("change", () => {
          visibleFields = Array.from(
            fieldMenu.querySelectorAll('input[type="checkbox"]:checked')
          ).map(el => el.value);
          renderTable();
        });
      });

      resetBtn.onclick = () => {
        visibleFields = [...viewerConfig.defaultFields];
        renderFieldMenu();
        renderTable();
      };
    }

    function bindGlobalHandlers() {
      const fullListBtn = document.getElementById("downloadFullToolsBtn");
      fullListBtn.onclick = downloadFullToolList;
      fullListBtn.textContent = "Download full Tools.txt";
    }

    function bindGotoHandlers() {
      document.querySelectorAll(".goto-btn[data-idx]").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-idx"));
          const url = getGotoUrl(toolEntries[idx]);
          if (!url) return;
          window.open(url, "_blank", "noopener");
        });
      });
    }

    function getGotoUrl(entry) {
      const rawLink = (findField(entry, "link") || findField(entry, "url") || "").trim();
      if (!rawLink) return "";

      const mdMatch = rawLink.match(/\[[^\]]+\]\(([^)]+)\)/);
      const extracted = mdMatch ? mdMatch[1].trim() : rawLink;

      if (!extracted) return "";
      if (/^https?:\/\//i.test(extracted)) return extracted;
      return "https://" + extracted;
    }

    function getFieldDisplayValue(entry, fieldName) {
      const value = String(findField(entry, fieldName) || "").replace(/\s+/g, " ").trim();
      if (fieldName.toLowerCase() === "category") {
        return normalizeCategory(value, entry.title || "");
      }
      return value;
    }

    function downloadFullToolList() {
      if (!toolListText) return;

      const blob = new Blob([toolListText], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Tools.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    function hydrateAvailableFields(discoveredHeaders) {
      const discovered = uniqueLowercaseArray(discoveredHeaders || []);
      viewerConfig.availableFields = mergeUnique(viewerConfig.availableFields, discovered);

      if (!viewerConfig.availableFields.includes("link")) {
        viewerConfig.availableFields.push("link");
      }

      viewerConfig.defaultFields = viewerConfig.defaultFields.filter(f =>
        viewerConfig.availableFields.includes(f)
      );

      if (!viewerConfig.defaultFields.length) {
        viewerConfig.defaultFields = viewerConfig.availableFields
          .filter(f => f !== "link")
          .slice(0, 5);
      }
    }

    function formatFieldLabel(fieldName) {
      return fieldName
        .replace(/[_\-]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function uniqueLowercaseArray(value) {
      if (!Array.isArray(value)) return [];
      const cleaned = value
        .map(item => String(item).trim().toLowerCase())
        .filter(Boolean);
      return Array.from(new Set(cleaned));
    }

    function mergeUnique(primary, secondary) {
      return Array.from(new Set([...(primary || []), ...(secondary || [])]));
    }

    function parseToolList(text) {
      const blocks = String(text || "")
        .split(/\r?\n\s*\r?\n+/)
        .map(block => block.trim())
        .filter(Boolean);

      if (!blocks.length) return { headers: [], entries: [] };

      const entries = blocks.map(parseBlock).filter(entry => entry.title);

      return {
        headers: ["title", "description", "author", "tags", "category", "link"],
        entries
      };
    }

    function parseBlock(blockText) {
      const entry = {};

      blockText
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line && !line.startsWith("#"))
        .forEach(line => {
          const idx = line.indexOf("=");
          if (idx <= 0) return;

          const key = normalizeFieldName(line.slice(0, idx));
          const value = line.slice(idx + 1).trim();
          entry[key] = value;
        });

      entry.title = String(entry.title || "").trim();
      entry.description = String(entry.description || "").trim();
      entry.author = String(entry.author || "").trim();
      entry.tags = normalizeCommaList(entry.tags || "");
      entry.link = String(entry.link || "").trim();
      entry.category = normalizeCategory(entry.category || "", entry.title);

      return entry;
    }

    function normalizeCategory(value, titleHint) {
      const raw = String(value || "").trim();
      if (raw) {
        const exact = TOOL_CATEGORIES.find(c => c.toLowerCase() === raw.toLowerCase());
        if (exact) return exact;
      }
      return inferCategoryFromTitle(titleHint || "");
    }

    function inferCategoryFromTitle(title) {
      const t = String(title || "").toLowerCase();

      if (/(tutorial|guide|workflow|how to|intro|introduction|course|lesson|manual)/.test(t)) return "Guides";
      if (/(dataset|database|atlas|catalog|catalogue|archive|index|directory|corpus|bibliograph|list)/.test(t)) return "Datasets";
      if (/(library|libraries|package|sdk|module|api|framework)/.test(t)) return "Libraries";
      if (/(specification|spec\b|standard|schema|ontology|protocol|vocabular|reference model)/.test(t)) return "Specifications";
      if (/(script|scripts|\.r$|\.py$|calculator|converter)/.test(t)) return "Scripts";
      if (/(app|portal|platform|dashboard|viewer|service|website|webapp|product)/.test(t)) return "Products";
      if (/(tool|software|program|plugin|kit|suite|system|os)/.test(t)) return "Software";

      return "Others";
    }

    function normalizeCommaList(value) {
      return String(value || "")
        .split(",")
        .map(part => part.trim())
        .filter(Boolean)
        .join(", ");
    }

    function normalizeFieldName(name) {
      return String(name || "").trim().toLowerCase();
    }

    function findField(entry, name) {
      const target = String(name || "").toLowerCase();
      const keys = Object.keys(entry || {});
      const exact = keys.find(k => k.toLowerCase() === target);
      if (exact) return entry[exact];

      const partial = keys.find(k => k.toLowerCase().includes(target));
      return partial ? entry[partial] : "";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    loadTools();
  </script>
</body>
</html>
